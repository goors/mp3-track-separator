[package]
name = "app"
version = "1.0.2"
description = "Track sepeartor"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
tauri = { version = "2.10.0", features = ["tray-icon", "image-png"] }
serde = { version = "1.0.228", features = ["derive"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-websocket = "2.4.2"
tauri-plugin-sql = { version = "2.3.2", features = ["sqlite"] }
imap = "3.0.0-alpha.15"
base64 = "0.22.1"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-shell = "2.3.5"
serde_json = "1.0.149"
rusqlite = { version = "0.31", features = ["bundled"] }
sysinfo = "0.30" # Or latest
zip = "2.3.0"
